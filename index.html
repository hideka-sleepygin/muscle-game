<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猜猜我是誰：國考複習</title>
<style>
:root{
  --bg:#F7F5F0;--card:#FFFFFF;--ink:#2B2B33;--muted:#6B6B76;--line:#EEEAE2;--edge:#CFCAC0;--track:#E6E2D8;
  --primary:#2F6F8F;--primary-soft:#E6F0F4;
  --gold:#B7791F;--gold-soft:#FBF1DC;
  --good:#2E6B47;--good-bg:#E7F3EC;--bad:#B4533F;--bad-bg:#FBEDE8;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:24px 16px 64px;position:relative;z-index:1}
h1{font-size:24px;margin:0 0 4px;font-weight:700}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:16px 18px;margin:14px 0}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:9px 14px;cursor:pointer;transition:transform .1s,border-color .15s}
button:hover{border-color:var(--primary)}
button:active{transform:scale(.97)}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;padding:10px 20px}
button:disabled{cursor:default;color:var(--muted);background:#F3F1EC;border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 4px}
.pill.star{color:var(--gold);font-weight:700;font-size:15px}
.pill.quit{border:1px solid var(--edge);border-radius:8px;padding:3px 10px;font-size:13px;color:var(--primary);background:var(--card)}
.combo{color:var(--gold);font-weight:700}
.clue{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;animation:pop .25s ease-out}
.clue b{display:block;font-size:12px;color:var(--primary);font-weight:700}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
button.hint{font-size:14px;padding:6px 12px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:8px}
.grid button{padding:10px 6px;font-size:15px;border-color:var(--line)}
.grid button.wrong{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;border-color:transparent}
.grid button.sel{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:15px;padding:11px 14px;border-color:var(--line)}
.opt.right,.grid button.right{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);color:var(--bad);border-color:transparent;text-decoration:line-through}
.msg{min-height:24px;font-size:15px;font-weight:700;margin-top:10px}
.msg.bad,.badtxt{color:var(--bad)}
.goodtxt{color:var(--good)}
.reveal dt{color:var(--primary);font-size:12px;font-weight:700;margin-top:8px}
.reveal dd{margin:0}
.mem{background:var(--gold-soft);color:#7A5210;border-radius:10px;padding:10px 14px;margin-top:12px}
.badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);margin-left:8px;vertical-align:middle;font-weight:400}
.stampb{background:var(--gold-soft);color:#7A5210}
.cheer{font-size:22px;font-weight:800;color:var(--gold);margin-bottom:6px;animation:bounce .5s ease-out}
.cheer.soft{font-size:17px;color:var(--primary)}
@keyframes bounce{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.card.win{border:1.5px solid #E9C98A}
.pts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.pts span{background:var(--good-bg);color:var(--good);border-radius:999px;padding:2px 10px;font-size:13px}
.pts .sum{background:var(--gold-soft);color:#7A5210;font-weight:700}
.newstamp{display:inline-block;margin-top:8px;background:var(--gold-soft);color:#7A5210;font-weight:700;border-radius:999px;padding:3px 14px;animation:bounce .5s ease-out}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.bonusq{margin-top:14px;padding-top:12px;border-top:1px dashed var(--edge)}
.bar{height:6px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.wallet .big{font-size:22px;font-weight:800;color:var(--gold)}
.walletline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700;color:var(--gold)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.float{position:fixed;z-index:20;font-size:26px;font-weight:800;color:var(--gold);pointer-events:none;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.unlock{background:var(--gold-soft);color:#7A5210}
.savebox{background:var(--primary-soft)}
.subject{margin-top:22px}
.subject h2{font-size:15px;color:var(--muted);font-weight:700;margin:0 0 6px}
.unitlist{background:var(--card);border-radius:14px;padding:2px 16px}
.urow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.uinfo{flex:1;min-width:0}
.uname{font-weight:700}
.ucount{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.urow .bar{max-width:220px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:10px}
.modes button{text-align:left;padding:12px 14px}
.modes button .lock{display:block;font-size:12px;color:var(--muted);font-weight:400}
.modes .mname{font-weight:700}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:10px}
.dexcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);text-align:left;background:var(--card)}
.dexcard .dname{font-weight:700;font-size:15px}.dexcard .dsub{font-size:12px;color:var(--muted)}.dexcard .dst{font-size:12px}
.dexcard.l0{background:#F3F1EC;color:var(--muted);border-color:transparent}
.dexcard.l1{border-color:#D9B79A}
.dexcard.l2{border-color:#B9C2CC}
.dexcard.l3{border-color:#E2B54F;background:#FFFBF0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.ava{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;background:var(--card)}
.sync{font-size:12px;color:var(--muted);font-weight:400}
.linkbtn{font-size:13px;padding:5px 12px;color:var(--primary)}
.soon{color:var(--muted);font-size:14px;padding:10px 16px;border:1px dashed var(--edge);border-radius:12px;margin:8px 0}
.rank{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)}
.rank.me{color:var(--primary);font-weight:700}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink)}
.field textarea{resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.avas{display:flex;gap:8px;flex-wrap:wrap}
.avas button{width:44px;height:44px;border-radius:50%;font-size:20px;padding:0}
.avas button.on{border-color:var(--primary);background:var(--primary-soft)}
.rules{font-size:14px;color:var(--muted)}
.rules b{color:var(--ink)}
.teacher{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
.teacher .tlink{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:2px}
.teacher input{font:inherit;width:100px;padding:5px 8px;border:1px solid var(--edge);border-radius:8px}
.teacher .err{display:inline;margin-left:6px}
.grp{margin-top:20px}
.grp h2{font-size:17px;margin:0 0 6px}
.rule{background:var(--primary-soft);color:#24546B;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:8px}
.stcard{background:var(--card);border-radius:12px;padding:12px 14px;margin:8px 0;border:1px solid var(--line)}
.stcard.closed{cursor:pointer}
.stcard .sthead{display:flex;align-items:center;gap:6px}
.sttoggle{margin-left:auto;font-size:12px;color:var(--primary)}
.stcard .reveal{margin:4px 0 0}
.lmbox{background:var(--primary-soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.lmname{font-size:18px;font-weight:700;color:#24546B}
.lmwhere{font-size:13px;color:var(--muted);margin:2px 0 6px}
.lmkin{font-size:15px}
.lmrow{padding:8px 0;border-top:1px solid rgba(47,111,143,.15)}
.lmrow:first-of-type{border-top:none}
.lmdir{font-size:15px}
.lmicon{display:inline-block;width:26px}
.lmmus{margin:6px 0 0 26px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mchip{background:var(--card);border:1px solid var(--edge);border-radius:999px;padding:1px 12px;font-size:14px;font-weight:700}
.mchip.q{color:var(--muted);font-weight:400;min-width:36px;text-align:center}
.lmnote{font-size:12px;color:var(--muted)}
.lmtip{margin-top:10px;padding-top:8px;border-top:1px dashed var(--edge);font-size:14px;color:#7A5210}
</style>
</head>

<canvas id="fx"></canvas>
<main id="app"></main>
<script>
// 科目資料檔（data/*.js）用 registerSubject 登記自己
const SUBJECTS = {};
function registerSubject(id, def){ SUBJECTS[id] = def; }
</script>
<script>
// ===== 雲端存檔設定 =====
// 雲端存檔設定：把 Google Apps Script 部署後拿到的網址貼在下面的引號裡。
// 留空白就不開啟登入，成績只存在學生自己的瀏覽器。
const CLOUD_URL = "";
// 匿名紀錄與回饋：貼上同一個 Apps Script 網址就會開啟。學生不用登入，
// 每玩完一局匿名記一列（裝置代號、單元、關卡、分數），首頁和結算頁會出現「給老師的回饋」。
const LOG_URL = "https://script.google.com/macros/s/AKfycbw2sIvucY47JIodQ94R9pXWAMZIRqq1rLlEhlXlSJnlZP9UdI2tZYk0mEj3mkJznBSF/exec";
</script>
<!-- ===== 題目資料：之後新增科目，就在下面再加一段 registerSubject(...) ===== -->
<script>
// 肌肉解剖：每個單元一組題目，之後新增單元只要照同樣格式加在 units 裡。
// values 的順序對應 fields：起點、止點、肌群、神經、動作。
registerSubject("anatomy", {
  name: "肌肉解剖",
  icon: "💪",
  theme: ["#ff5d8f", "#ff9f1c"],
  noun: "肌肉",
  measure: "條",         // 量詞：一條肌肉
  fields: [
    { label: "起點", clue: "我的起點（近端連接處）在{v}" },
    { label: "止點", clue: "我的止點（遠端連接處）在{v}" },
    { label: "肌群", clue: "我屬於{v}" },
    { label: "神經", clue: "支配我的神經是{v}" },
    { label: "動作", clue: "我的動作：{v}" }
  ],
  firstClues: [2, 0],    // 一般模式開局先給肌群、再給起點，學生先有整體感
  order: [2, 0, 1, 3, 4], // 線索與卡片的顯示順序：肌群、起點、止點、神經、動作
  hardFirstClues: [3, 4], // 困難模式：肌群之後，改從神經或動作開始
  groupField: 2,         // 「肌群」用來出肌群關
  keyField: 3,           // 「神經」用來出「哪一條不一樣」
  bonusOrder: [3, 1, 0, 4],
  lockedModes: [
    { icon: "📝", name: "國考實戰", need: 3 }
  ],
  units: {
  "head": {
    "name": "頭頸部",
    "desc": "咀嚼肌、表情肌、眼外肌、舌肌、舌骨上下肌、胸鎖乳突肌與斜角肌，共 36 條",
    "items": [
      {
        "name": "咬肌",
        "values": [
          "顴弓",
          "下頜枝外面與下頜角",
          "咀嚼肌",
          "三叉神經下頜支（V3）",
          "用力咬緊牙齒、嚼口香糖時，把下巴往上拉（上提下頜）"
        ],
        "memo": "咬牙時摸臉頰外側，鼓起來的就是我"
      },
      {
        "name": "顳肌",
        "values": [
          "顳窩（太陽穴）",
          "下頜骨冠狀突",
          "咀嚼肌",
          "三叉神經下頜支（V3）",
          "咬牙時把下巴往上拉（上提下頜）；後面的纖維還能把往前突出的下巴拉回來（下頜後縮）"
        ],
        "memo": "太陽穴的扇形肌肉；「下頜後縮」題目的答案就是我"
      },
      {
        "name": "翼內肌",
        "values": [
          "蝶骨翼突外側板的內面",
          "下頜枝內面與下頜角",
          "咀嚼肌",
          "三叉神經下頜支（V3）",
          "咬緊牙齒（上提下頜），吃東西時讓下巴左右磨"
        ],
        "memo": "咬肌在外、我在內，一起夾住下頜角"
      },
      {
        "name": "翼外肌",
        "values": [
          "蝶骨翼突外側板的外面",
          "下頜頸與顳下頜關節的關節盤",
          "咀嚼肌",
          "三叉神經下頜支（V3）",
          "打哈欠、張大嘴巴咬漢堡（下拉下頜，也就是開口），也能把下巴往前推（前伸）"
        ],
        "memo": "咀嚼肌「三閉一開」，唯一開口的就是我"
      },
      {
        "name": "口輪匝肌",
        "values": [
          "環繞嘴唇一圈，沒有明顯的骨性起點",
          "嘴唇周圍的皮膚",
          "表情肌",
          "顏面神經（VII）",
          "閉上嘴巴、嘟嘴、吹口哨"
        ],
        "memo": "「輪匝」就是一圈：環繞嘴巴的環狀肌"
      },
      {
        "name": "頰肌",
        "values": [
          "上、下頜骨後段的外側",
          "口角",
          "表情肌",
          "顏面神經（VII）",
          "鼓起臉頰吹氣球、吹喇叭；吃飯時把食物推回牙齒之間"
        ],
        "memo": "附著下頜骨卻不是咀嚼肌，屬顏面神經，常當陷阱選項"
      },
      {
        "name": "眼輪匝肌",
        "values": [
          "眼眶內側的骨頭（額骨、上頜骨）與內眥韌帶",
          "繞眼眶與眼瞼一圈，回到起點附近",
          "表情肌",
          "顏面神經（VII）",
          "閉上眼睛、用力擠眼睛"
        ],
        "memo": "「輪匝」就是一圈：環繞眼睛的環狀肌；名字不像，但它是表情肌（考過）"
      },
      {
        "name": "枕額肌",
        "values": [
          "枕骨上項線（枕腹）",
          "經帽狀腱膜，連到眉毛上方的皮膚（額腹）",
          "表情肌",
          "顏面神經（VII）",
          "抬眉毛、皺額頭，做出驚訝的表情"
        ],
        "memo": "前後兩個肌腹靠頭頂的帽狀腱膜相連"
      },
      {
        "name": "顴大肌",
        "values": [
          "顴骨",
          "嘴角",
          "表情肌",
          "顏面神經（VII）",
          "把嘴角往上、往外拉，露出笑容"
        ],
        "memo": "笑的時候從顴骨把嘴角拉上去"
      },
      {
        "name": "提上唇肌",
        "values": [
          "眼眶下緣（上頜骨）",
          "上唇",
          "表情肌",
          "顏面神經（VII）",
          "把上唇往上提，露出上排牙齒"
        ],
        "memo": "名字就是動作：「提」起「上唇」；和口輪匝肌相反，是把嘴唇拉開"
      },
      {
        "name": "降下唇肌",
        "values": [
          "下頜骨前面",
          "下唇",
          "表情肌",
          "顏面神經（VII）",
          "把下唇往下、往外拉，露出下排牙齒"
        ],
        "memo": "名字就是動作：「降」低「下唇」"
      },
      {
        "name": "頦肌",
        "values": [
          "下頜骨門牙下方",
          "下巴的皮膚",
          "表情肌",
          "顏面神經（VII）",
          "把下巴皮膚往上推、讓下唇往前翹（想哭時皺下巴）"
        ],
        "memo": "下巴皺成「核桃皮」就是我在用力"
      },
      {
        "name": "頸闊肌",
        "values": [
          "鎖骨下方、胸大肌與三角肌上面的筋膜",
          "下頜骨下緣與嘴角的皮膚",
          "表情肌",
          "顏面神經（VII）",
          "繃緊頸部皮膚、把嘴角往下拉（驚嚇時脖子浮出條紋）"
        ],
        "memo": "長在頸部皮下，卻是表情肌，所以由顏面神經支配"
      },
      {
        "name": "上直肌",
        "values": [
          "眼眶後方的總腱環",
          "眼球上面",
          "眼外肌",
          "動眼神經（III）",
          "眼球往上轉（往上看）"
        ],
        "memo": "四條直肌都從眼窩深處的總腱環出發"
      },
      {
        "name": "下直肌",
        "values": [
          "眼眶後方的總腱環",
          "眼球下面",
          "眼外肌",
          "動眼神經（III）",
          "眼球往下轉（往下看）"
        ],
        "memo": "和上直肌一上一下，都是動眼神經"
      },
      {
        "name": "內直肌",
        "values": [
          "眼眶後方的總腱環",
          "眼球內側（靠鼻子那側）",
          "眼外肌",
          "動眼神經（III）",
          "眼球往內轉（看自己的鼻尖）"
        ],
        "memo": "和外直肌一內一外，但神經不同"
      },
      {
        "name": "外直肌",
        "values": [
          "眼眶後方的總腱環",

  const pool = unitOf(sid, uid).items.map((it, i) => ({ i, w: (4 - lvl(sid, uid, it.name)) ** 2 }));

    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");

    let h = 5381; for (const ch of raw) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;

  }

    if (!/^[A-Za-z0-9]{4,20}$/.test(id)){ errEl.textContent = "學號請輸入 4～20 個英文字母或數字"; return; }
    if (!/^\d{4}$/.test(pinRaw)){ errEl.textContent = "密碼請輸入 4 位數字"; return; }
    if (register && !nick){ errEl.textContent = "幫自己取個暱稱吧！"; return; }
    errEl.textContent = "連線中…";
    try {
      const pin = await hashPin(id, pinRaw);
      const r = await api(register ? { action: "login", id, pin, nick, avatar } : { action: "login", id, pin });
      if (r.needRegister){ register = true; draw(); return; }
      if (!r.ok){ errEl.textContent = r.error === "密碼不對" ? "密碼不對喔，再試一次" : (r.error || "登入失敗"); return; }
      save("guess-account", { id, pin, nick: r.nick, avatar: r.avatar || avatar });
      mergeProgress(r.progress);
      await pushProgress();
      launch(3);
      back();
    } catch(e){ errEl.textContent = "連不上雲端，請確認網路後再試一次"; }
  }
  draw();
}

// ---------- 煙火 ----------
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
let parts = [], rockets = [], running = false;
function sizeFx(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
addEventListener("resize", sizeFx); sizeFx();
const FX_COLORS = ["#ff5d8f","#ff9f1c","#ffd23f","#2ec4b6","#3a86ff","#8338ec","#ff006e","#06d6a0"];
function launch(n = 2){
  for (let k = 0; k < n; k++){
    setTimeout(() => {
      rockets.push({ x: innerWidth * (0.15 + Math.random() * 0.7), y: innerHeight, vy: -(innerHeight * 0.017 + Math.random() * 4), ty: innerHeight * (0.15 + Math.random() * 0.3), c: pick(FX_COLORS) });
      if (!running){ running = true; requestAnimationFrame(tick); }
    }, k * 260);
  }
}
function burst(x, y, c){
  for (let i = 0, n = 70; i < n; i++){
    const a = (Math.PI * 2 * i) / n, s = 2 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: Math.random() < 0.3 ? pick(FX_COLORS) : c });
  }
}
function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  rockets = rockets.filter(r => {
    r.y += r.vy; r.vy *= 0.985;
    ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, 7); ctx.fill();
    if (r.y <= r.ty || r.vy > -1){ burst(r.x, r.y, r.c); return false; }
    return true;
  });
  parts = parts.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.985; p.life -= 0.012;
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    return p.life > 0;
  });
  if (rockets.length || parts.length) requestAnimationFrame(tick);
  else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}
function floatText(t){
  const el = document.createElement("div");
  el.className = "float"; el.textContent = t;
  el.style.left = innerWidth / 2 - 40 + "px"; el.style.top = innerHeight * 0.3 + "px";
  document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
}

// ---------- 一般關／困難模式 ----------
function newState(sid, uid, mode){
  return { mode, sid, uid, sub: subj(sid), u: unitOf(sid, uid), done: 0, total: 0, combo: 0, log: [], ups: [], minBefore: unitMin(sid, uid) };
}
function start(sid, uid, hard){
  S = Object.assign(newState(sid, uid, hard ? "hard" : "single"), { hard, queue: drawItems(sid, uid, rounds()), requeued: new Set() });
  round();
}
function round(){
  const i = S.queue.shift();
  // 肌群裡只有這一條的，先給肌群等於直接給答案，所以開局不給肌群
  const it = S.u.items[i], alone = S.u.items.filter(x => groupOf(S.sub, x) === groupOf(S.sub, it)).length === 1;
  let shown = S.hard ? [S.sub.groupField, pick(S.sub.hardFirstClues)] : S.sub.firstClues.slice();
  if (alone) shown = shown.filter(f => f !== S.sub.groupField);
  S.cur = { i, it: S.u.items[i], shown, start: shown.length, wrong: [], finished: false };
  render();
}
const isQuiz = () => S.mode === "group" || S.mode === "landmark";
const modeLabel = () => S.mode === "landmark" ? "地標關" : S.mode === "group" ? S.sub.fields[S.sub.groupField].label + "關" : S.hard ? "困難模式" : "一般關";
function hud(){
  const left = isQuiz() ? S.qs.length - S.qi - (S.cur.finished ? 1 : 0) : S.queue.length + (S.cur && !S.cur.finished ? 1 : 0);
  return `<div class="hud"><span class="pill">${S.u.name}・${modeLabel()}　已完成 ${S.done}／剩 ${left} 題</span>
    <span class="row">${S.combo >= 2 ? `<span class="pill combo">🔥 連擊 ×${S.combo}</span>` : ""}<span class="pill star">⭐ ${S.total}</span><button class="pill quit" id="quit">🏠 回首頁</button></span></div>`;
}

function render(msg = "", cls = ""){
  const c = S.cur, it = c.it, sub = S.sub;
  const nF = sub.fields.length;
  const left = (sub.order || [...Array(nF).keys()]).filter(i => !c.shown.includes(i));
  app.innerHTML = `
    ${hud()}
    <div class="card">
      <h2>我是哪${one(sub)}？🤔</h2>
      ${c.shown.map(i => `<div class="clue t${i % 5}"><b>${label(i)}</b><span>${clueOf(sub, it, i)}</span></div>`).join("")}
      ${left.length ? `
        <p class="muted" style="margin:12px 0 6px">需要提示嗎？自己挑一種（少用提示，猜中時獎勵越多，還會有加碼挑戰）：</p>
        <div class="row">${left.map(i => `<button class="hint t${i % 5}" data-i="${i}">💡 看${label(i)}</button>`).join("")}</div>` : ""}
    </div>
    <div class="card">
      <p class="muted" style="margin:0">想好了就點下去：</p>
      <div class="grid">${S.u.items.map(x => x.name).map(n => `<button data-n="${esc(n)}" class="${c.wrong.includes(n) ? "wrong" : ""}" ${c.wrong.includes(n) ? "disabled" : ""}>${n}</button>`).join("")}</div>
      <div class="msg ${cls}" id="msg">${msg}</div>
      <div class="row" style="justify-content:flex-end;margin-top:8px"><button id="skip">換下一題 ⏭️</button></div>
    </div>`;
  app.querySelectorAll(".hint").forEach(b => b.onclick = () => { c.shown.push(+b.dataset.i); render(); });
  app.querySelectorAll(".grid button").forEach(b => b.onclick = () => guess(b.dataset.n));
  document.getElementById("skip").onclick = skip;
}

function guess(n){
  const c = S.cur;
  if (c.finished) return;
  if (n !== c.it.name){
    c.wrong.push(n);
    const stuck = c.wrong.length >= 2 && c.shown.length < S.sub.fields.length;
    render(stuck ? pick(CHEERS.stuck) : pick(CHEERS.wrong), "bad");
    app.querySelector(".grid").classList.add("shake");
    return;
  }
  c.finished = true;
  S.combo++;
  const unused = S.sub.fields.length - c.shown.length;
  c.parts = [["猜對", BASE]];
  if (unused) c.parts.push([`少用 ${unused} 個提示`, unused * PER_UNUSED_HINT]);
  if (!c.wrong.length) c.parts.push(["一次命中", FIRST_TRY]);
  if (S.combo >= 2) c.parts.push([`連擊 ×${S.combo}`, Math.min((S.combo - 1) * COMBO_STEP, COMBO_MAX)]);
  c.pts = c.parts.reduce((s, p) => s + p[1], 0);
  S.total += c.pts;
  c.cheer = S.combo >= 3 ? pick(CHEERS.combo) : c.shown.length === c.start ? pick(CHEERS.noHint) : c.shown.length <= c.start + 1 ? pick(CHEERS.fewHint) : pick(CHEERS.manyHint);
  launch(c.shown.length === c.start || S.combo >= 3 ? 4 : 2);
  floatText("+" + c.pts);
  c.bonus = S.sub.bonusOrder.filter(i => !c.shown.includes(i)).slice(0, 2);
  c.bonusOk = 0; c.bj = 0;
  if (c.bonus.length) showBonus(); else finalize();
}

function makeOptions(it, f){
  const right = it.values[f], g = groupOf(S.sub, it);
  const same = shuffle(S.u.items.filter(x => x.name !== it.name && groupOf(S.sub, x) === g).map(x => x.values[f]));
  const other = shuffle(S.u.items.filter(x => x.name !== it.name && groupOf(S.sub, x) !== g).map(x => x.values[f]));
  const opts = [];
  [...same, ...other].forEach(v => { if (v !== right && !opts.includes(v) && opts.length < 3) opts.push(v); });
  return shuffle([right, ...opts]);
}

function showBonus(){
  const c = S.cur, it = c.it, f = c.bonus[c.bj];
  app.innerHTML = `
    ${hud()}
    <div class="card win">
      ${c.bj === 0 ? `<div class="cheer">${c.cheer}</div>
      <h2>答對了！我是${it.name}<span class="badge">${groupOf(S.sub, it)}</span></h2>
      <div class="pts">${c.parts.map(p => `<span>${p[0]} +${p[1]}</span>`).join("")}</div>` : `<h2>${it.name}<span class="badge">${groupOf(S.sub, it)}</span></h2>`}
      <div class="bonusq"><span class="tag t${f % 5}">加碼挑戰 ${c.bj + 1}/${c.bonus.length}　+${BONUS}</span>
        <p style="font-size:18px;font-weight:700;margin:10px 0 6px">那${it.name}的${label(f)}是？</p>
        ${makeOptions(it, f).map(o => `<button class="opt">${o}</button>`).join("")}
        <div class="msg" id="bmsg"></div>
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = b.textContent === it.values[f];
    app.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.textContent === it.values[f]) x.classList.add("right"); });
    if (ok){ c.bonusOk++; S.total += BONUS; launch(1); floatText("+" + BONUS); }
    else b.classList.add("wrong");
    const last = c.bj === c.bonus.length - 1;
    document.getElementById("bmsg").innerHTML = `<span class="${ok ? "goodtxt" : "badtxt"}">${ok ? pick(CHEERS.bonusRight) : pick(CHEERS.bonusWrong)}</span>
      <div class="row" style="margin-top:10px"><button class="primary" id="bnext">${last ? "看完整卡片 ➜" : "下一題加碼 ➜"}</button></div>`;
    document.getElementById("bnext").onclick = () => { if (last) finalize(); else { c.bj++; showBonus(); } };
  });
}

function finalize(){
  const c = S.cur, it = c.it;
  const allBonus = c.bonus.length > 0 && c.bonusOk === c.bonus.length;
  const earned = S.hard ? (allBonus ? 3 : 2) : (allBonus ? 2 : 1);
  const old = raise(S.sid, S.uid, it.name, earned), now = Math.max(old, earned);
  c.saved = true;
  const up = now > old ? (old === 0 ? `🎖️ 新收集：${it.name}！拿到 ${STAMP[now]}` : `🎖️ ${it.name} 升級為 ${STAMP[now]}！`) : "";
  if (up) S.ups.push(`${it.name} ${STAMP[now]}`);
  const total = c.pts + c.bonusOk * BONUS;
  S.done++;
  S.log.push({ name: it.name, pts: total, hints: c.shown.length - c.start, skipped: false, bonus: `${c.bonusOk}/${c.bonus.length}` });
  if (up && old > 0) launch(2);
  reveal(true, total, up, allBonus || !c.bonus.length ? "" : `想拿 ${STAMP[Math.min(now + 1, 3)]}？下次加碼挑戰全部答對就行！`);
}

function skip(){
  const c = S.cur;
  if (c.finished) return;
  c.finished = true;
  S.combo = 0;
  const again = !S.requeued.has(c.i);
  if (again){ S.requeued.add(c.i); S.queue.push(c.i); }
  else { S.done++; S.log.push({ name: c.it.name, pts: 0, hints: c.shown.length - c.start, skipped: true }); }
  c.cheer = again ? pick(CHEERS.skip) : "沒關係！看完答案，下次一定記得 💪";
  reveal(false);
}

function cardDetail(sub, it){
  return `<dl class="reveal">${(sub.order || sub.fields.map((_, i) => i)).map(i => `<dt>${sub.fields[i].label}</dt><dd>${clueOf(sub, it, i)}</dd>`).join("")}</dl>
    <div class="mem">💡 記憶聯想：${it.memo}</div>`;
}

function reveal(correct, total = 0, up = "", tip = ""){
  const c = S.cur, it = c.it;
  const last = S.queue.length === 0;
  app.innerHTML = `
    ${hud()}
    <div class="card ${correct ? "win" : ""}">
      ${correct ? `<h2>${it.name}<span class="badge">${groupOf(S.sub, it)}</span><span class="badge stampb">${STAMP[lvl(S.sid, S.uid, it.name)]}</span></h2>
        <div class="pts"><span class="sum">這題共 +${total}</span>${c.bonus.length ? `<span>加碼 ${c.bonusOk}/${c.bonus.length}</span>` : ""}</div>`
      : `<div class="cheer soft">${c.cheer}</div><h2>答案是：${it.name}<span class="badge">${groupOf(S.sub, it)}</span></h2>`}
      ${up ? `<div class="newstamp">${up}</div>` : ""}
      ${tip ? `<p class="muted" style="margin-top:8px">${tip}</p>` : ""}
      ${cardDetail(S.sub, it)}
      <div class="row" style="margin-top:14px"><button class="primary" id="next">${last ? "看結果 🎆" : "下一題 ➜"}</button></div>
    </div>`;
  document.getElementById("next").onclick = () => last ? finish() : round();
}

// ---------- 結算 ----------
function finish(){
  const best = getBest(S.sid, S.uid, S.mode), isBest = S.total > best;
  if (isBest) setBest(S.sid, S.uid, S.mode, S.total);
  const before = getWallet(), after = before + S.total;
  save("guess-wallet", after);
  S.saved = true;
  const up = medalOf(after)[0] > medalOf(before)[0] ? medalOf(after)[1] : "";
  const title = TITLES.find(t => S.total >= t[0])[1];
  const later = S.log.filter(l => isQuiz() ? !l.ok : (l.skipped || l.hints >= 3));
  const c = stampCounts(S.sid, S.uid), tot = S.u.items.length, sub = S.sub;
  const askSave = cloudOn() && !getAcct();
  launch(up || isBest ? 9 : 6);
  app.innerHTML = `
    <div class="cheer">恭喜完成！你今天又更接近國考高分了 🎆</div>
    <h1>${S.u.name}・${modeLabel()}：${S.total} 分</h1>
    <p>稱號：<b>${title}</b>${isBest ? `<span class="badge">新紀錄！</span>` : `<span class="muted">　最佳紀錄 ${best} 分</span>`}</p>
    ${askSave ? `<div class="card savebox"><b>想保留這次的印章和點數嗎？</b><br>登入後換手機也能接著玩，還能上全班排行榜！
      <div class="row" style="margin-top:10px"><button class="primary" id="savego">🔐 登入並存檔</button><button id="savelater">先不用</button></div></div>` : ""}
    <div class="card wallet">
      <div>點數 +${S.total}${cloudOn() && getAcct() ? `　<span class="sync" id="sync">${SYNC_TEXT[syncState] || ""}</span>` : ""}</div>
      <div class="big">⭐ ${after}</div>
      ${up ? `<div class="newstamp">🎉 升級了！你現在是 ${up}</div>` : `<div style="font-size:14px">${nextMedal(after) ? `再 ${nextMedal(after)[0] - after} 點升級為 ${nextMedal(after)[1]}` : "最高等級！"}</div>`}
      <div style="font-size:14px;margin-top:6px">${S.u.name}印章：🥉 猜中過 ${tot - c[0]}　🥈 加碼全對過 ${c[2] + c[3]}　🥇 困難模式也過關 ${c[3]}（共 ${tot}）</div>
      ${S.ups.length ? `<div style="font-size:14px">這局升級：${S.ups.join("、")}</div>` : ""}
    </div>
    <div class="card">
      <table>${S.log.map(l => `<tr><td>${l.name}</td><td class="muted">${isQuiz() ? (l.ok ? "答對 ✨" : "看了答案") : l.skipped ? "換過題" : `${l.hints ? `用了 ${l.hints} 個提示` : "零提示 ✨"}${l.bonus ? `・加碼 ${l.bonus}` : ""}`}</td><td>${l.pts ? "+" + l.pts : "—"}</td></tr>`).join("")}</table>
    </div>
    ${later.length ? `<div class="card"><h2>下次再挑戰 💪</h2><p>${later.map(l => l.name).join("、")}</p><p class="muted">去「學習卡片」再看一次，下一局一定能秒殺！</p></div>` : `<div class="card"><h2>全部輕鬆過關！🏆</h2><p class="muted">太強了！試試困難模式或${sub.fields[sub.groupField].label}關，把印章升到金章！</p></div>`}
    <div class="row"><button class="primary" id="again">再玩一次</button><button id="dexb">📘 學習卡片</button><button id="unitb">回單元</button><button id="home">回首頁</button></div>
    ${logOn() ? `<p class="muted" style="margin-top:14px">覺得這個遊戲有沒有幫助？<button class="linkbtn" id="fbEnd">💬 給老師回饋</button></p>` : ""}`;
  logRound();
  const sid = S.sid, uid = S.uid, mode = S.mode;
  document.getElementById("again").onclick = () => mode === "landmark" ? startLandmark(sid, uid) : mode === "group" ? startGroup(sid, uid) : start(sid, uid, mode === "hard");
  document.getElementById("dexb").onclick = () => study(sid, uid);
  document.getElementById("unitb").onclick = () => unitPage(sid, uid);
  document.getElementById("home").onclick = home;
  const fbEnd = document.getElementById("fbEnd");
  if (fbEnd) fbEnd.onclick = () => feedbackPage(() => unitPage(sid, uid));
  if (askSave){
    document.getElementById("savego").onclick = () => loginPage(home);
    document.getElementById("savelater").onclick = e => e.target.closest(".savebox").remove();
  }
  pushProgress();
}

// ---------- 分類關（解剖學叫肌群關） ----------
function groupQuestions(){
  const sub = S.sub, items = S.u.items, m = sub.measure, keyLabel = sub.fields[sub.keyField].label;
  const byGroup = {}, byKey = {};
  items.forEach(it => { (byGroup[groupOf(sub, it)] = byGroup[groupOf(sub, it)] || []).push(it); (byKey[keyOf(sub, it)] = byKey[keyOf(sub, it)] || []).push(it); });
  const big = o => Object.entries(o).filter(([, v]) => v.length >= 3);
  const gens = [];
  big(byGroup).forEach(([g, ms]) => gens.push(() => {
    const three = shuffle(ms).slice(0, 3), out = pick(items.filter(x => groupOf(sub, x) !== g));
    return { type: "one", label: "找臥底", q: `下面哪一${m}「不屬於」${g}？`, opts: shuffle([...three, out]).map(x => x.name), ans: [out.name],
      explain: `${out.name} 屬於${groupOf(sub, out)}。${g}的成員有：${ms.map(x => x.name).join("、")}。` };
  }));
  big(byKey).forEach(([k, ms]) => gens.push(() => {
    const three = shuffle(ms).slice(0, 3), out = pick(items.filter(x => keyOf(sub, x) !== k && !x.mixedKey));
    const four = shuffle([...three, out]);
    return { type: "one", label: "找臥底", q: `下面哪一${m}的${keyLabel}跟其他三${m}「不一樣」？`, opts: four.map(x => x.name), ans: [out.name],
      explain: four.map(x => `${x.name}：${x.values[sub.keyField]}`).join("<br>") };
  }));
  Object.entries(byGroup).filter(([, v]) => v.length >= 2).forEach(([g, ms]) => gens.push(() => {
    const others = shuffle(items.filter(x => groupOf(sub, x) !== g)).slice(0, Math.max(6 - ms.length, 2));
    return { type: "multi", label: "點名", q: `${g}有哪幾${m}？請全部選出來`, opts: shuffle([...ms, ...others]).map(x => x.name), ans: ms.map(x => x.name),
      explain: `${g}：${ms.map(x => `${x.name}（${keyOf(sub, x)}）`).join("、")}` };
  }));
  const qs = [], seen = new Set();
  for (let guard = 0; qs.length < rounds() && guard < 200 && gens.length; guard++){
    const q = pick(gens)();
    const key = q.q + q.opts.slice().sort().join();
    if (!seen.has(key)){ seen.add(key); qs.push(q); }
  }
  return qs;
}

// ---------- 地標關：從骨頭地標反查附著的肌肉，附肌動學說明 ----------
const LANDMARK_ASK = "請問哪些肌肉附著在這裡？（可能不只一條，請全部選出來）";
const LANDMARK_NOTE = "請依本遊戲介紹的肌肉作答，並注意題目問的是起點、止點，還是肌腱經過的位置。";
// 一個方向一行：作答前只顯示方向和動作，答完才填入肌肉名稱
function lmBlocks(L, reveal){
  return L.blocks.map(b => `<div class="lmrow">
    <div class="lmdir"><span class="lmicon">${b.icon}</span><b>${b.dir}</b> → ${b.act}</div>
    ${b.m.length ? `<div class="lmmus">${reveal ? b.m.map(n => `<span class="mchip">${n}</span>`).join("") : b.m.map(() => `<span class="mchip q">？</span>`).join("")}${reveal && b.note ? `<span class="lmnote">${b.note}</span>` : ""}</div>` : ""}
  </div>`).join("");
}
function landmarkQuestions(){
  const items = S.u.items;
  return shuffle(S.u.landmarks).slice(0, rounds()).map((L, i) => {
    const others = shuffle(items.filter(x => !L.answers.includes(x.name)));
    const opts = shuffle([...L.answers, ...others.slice(0, Math.max(7 - L.answers.length, 3)).map(x => x.name)]);
    return { type: "multi", label: "地標關", q: L.ask || LANDMARK_ASK, opts, ans: L.answers,
      intro: `${i === 0 ? `<p class="muted">${LANDMARK_NOTE}</p>` : ""}<div class="lmbox"><div class="lmname">📍 ${L.name}</div><div class="lmwhere">在哪裡：${L.where}</div>${lmBlocks(L, false)}</div>`,
      explainHtml: `<div class="lmbox">${lmBlocks(L, true)}${L.tip ? `<div class="lmtip">💡 ${L.tip}</div>` : ""}</div>`,
      logName: L.name };
  });
}
function startLandmark(sid, uid){
  S = Object.assign(newState(sid, uid, "landmark"), { qi: 0 });
  S.qs = landmarkQuestions();
  S.cur = { finished: false, wrong: [], sel: [] };
  renderGroup();
}

function startGroup(sid, uid){
  S = Object.assign(newState(sid, uid, "group"), { qi: 0 });
  S.qs = groupQuestions();
  S.cur = { finished: false, wrong: [], sel: [] };
  renderGroup();
}

function renderGroup(msg = "", cls = ""){
  const q = S.qs[S.qi], c = S.cur;
  app.innerHTML = `
    ${hud()}
    <div class="card">
      <span class="tag ${q.type === "multi" ? "t2" : "t4"}">${S.mode === "landmark" ? "📍" : "🧩"} ${q.label}</span>
      ${q.intro || ""}
      <h2 style="margin-top:10px">${q.q}</h2>
      <div class="grid">${q.opts.map(o => `<button data-n="${esc(o)}" class="${c.wrong.includes(o) ? "wrong" : c.sel.includes(o) ? "sel" : ""}" ${c.wrong.includes(o) ? "disabled" : ""}>${o}</button>`).join("")}</div>
      ${q.type === "multi" ? `<div class="row" style="margin-top:10px"><button class="primary" id="submit">選好了，送出 ✔</button></div>` : ""}
      <div class="msg ${cls}" id="msg">${msg}</div>
    </div>`;
  app.querySelectorAll(".grid button").forEach(b => b.onclick = () => {
    const n = b.dataset.n;
    if (q.type === "multi"){ c.sel = c.sel.includes(n) ? c.sel.filter(x => x !== n) : [...c.sel, n]; renderGroup(); return; }
    if (n === q.ans[0]) groupDone(true); else { c.wrong.push(n); renderGroup(pick(CHEERS.wrong), "bad"); app.querySelector(".grid").classList.add("shake"); }
  });
  if (q.type === "multi") document.getElementById("submit").onclick = () => {
    if (!c.sel.length){ renderGroup("先選至少一個再送出喔！", "bad"); return; }
    groupDone(c.sel.length === q.ans.length && q.ans.every(a => c.sel.includes(a)));
  };
}

function groupDone(ok){
  const q = S.qs[S.qi], c = S.cur;
  c.finished = true;
  let pts = 0, partsHtml = "";
  if (ok){
    S.combo++;
    const ps = [["答對", BASE]];
    if (!c.wrong.length) ps.push(["一次命中", FIRST_TRY]);
    if (S.combo >= 2) ps.push([`連擊 ×${S.combo}`, Math.min((S.combo - 1) * COMBO_STEP, COMBO_MAX)]);
    pts = ps.reduce((s, p) => s + p[1], 0);
    S.total += pts;
    partsHtml = `<div class="pts">${ps.map(p => `<span>${p[0]} +${p[1]}</span>`).join("")}<span class="sum">這題 +${pts}</span></div>`;
    launch(S.combo >= 3 ? 4 : 2); floatText("+" + pts);
  } else S.combo = 0;
  S.done++;
  S.log.push({ name: q.logName ? q.label + "：" + q.logName : q.label + "：" + q.q.replace(/？.*$/, "？"), pts, ok });
  const last = S.qi === S.qs.length - 1;
  app.innerHTML = `
    ${hud()}
    <div class="card ${ok ? "win" : ""}">
      <div class="cheer ${ok ? "" : "soft"}">${ok ? (S.combo >= 3 ? pick(CHEERS.combo) : pick(CHEERS.fewHint)) : "差一點！看一下正確答案，下一題扳回來 💪"}</div>
      <h2>${q.logName ? "📍 " + q.logName : q.q}</h2>
      ${partsHtml}
      ${q.explainHtml
        ? `${!ok ? `<p class="muted">你選的是：${c.sel.join("、")}</p>` : ""}${q.explainHtml}`
        : `<p>正確答案：<b>${q.ans.join("、")}</b>${!ok && q.type === "multi" ? `<br><span class="muted">你選的是：${c.sel.join("、")}</span>` : ""}</p>
      <div class="mem">💡 ${q.explain}</div>`}
      <div class="row" style="margin-top:14px"><button class="primary" id="next">${last ? "看結果 🎆" : "下一題 ➜"}</button></div>
    </div>`;
  document.getElementById("next").onclick = () => {
    if (last) finish();
    else { S.qi++; S.cur = { finished: false, wrong: [], sel: [] }; renderGroup(); }
  };
}

// ---------- 學習卡片：先看正確版本，再去挑戰 ----------
// 依肌群分段，每段先講「這一群的神經規則和例外」，再列出每一條的完整卡片
function groupRule(sub, items){
  const count = {};
  items.forEach(it => { const k = keyOf(sub, it); count[k] = (count[k] || 0) + 1; });
  const keys = Object.keys(count).sort((a, b) => count[b] - count[a]);
  const keyLabel = sub.fields[sub.keyField].label;
  if (keys.length === 1) return `這一群的${keyLabel}都是 <b>${keys[0]}</b>`;
  const main = keys[0];
  if (count[main] < 2) return `這一群的${keyLabel}各不相同，要一條一條記`;
  const ex = items.filter(it => keyOf(sub, it) !== main);
  return `這一群的${keyLabel}多半是 <b>${main}</b>；例外：${ex.map(it => `${it.name}（${it.values[sub.keyField]}）`).join("、")}`;
}

function study(sid, uid, opts = {}){
  const sub = subj(sid), u = unitOf(sid, uid);
  const hide = opts.hide !== undefined ? opts.hide : load("guess-study-hide", false);
  const openSet = opts.open || new Set();
  const groups = [];
  u.items.forEach((it, i) => {
    const g = groupOf(sub, it);
    let grp = groups.find(x => x.name === g);
    if (!grp){ grp = { name: g, items: [] }; groups.push(grp); }
    grp.items.push(Object.assign({ i }, it));
  });
  const order = sub.order || sub.fields.map((_, i) => i);
  app.innerHTML = `
    <div class="row" style="justify-content:space-between"><h1>📘 ${u.name}學習卡片</h1><button id="back">返回</button></div>
    <p class="muted">先把正確的卡片看熟，再去挑戰。卡片依${sub.fields[sub.groupField].label}分組，每組最上面是這一組的${sub.fields[sub.keyField].label}規則和例外。</p>
    <div class="row" style="margin:6px 0 4px">
      <button class="${hide ? "" : "primary"}" id="showAll">全部展開</button>
      <button class="${hide ? "primary" : ""}" id="hideAll">只看名稱，自己想再點開</button>
    </div>
    ${groups.map(g => `
      <div class="grp">
        <h2>${g.name}<span class="ucount">${g.items.length} ${sub.measure}</span></h2>
        <div class="rule">${groupRule(sub, g.items)}</div>
        ${g.items.map(it => {
          const L = lvl(sid, uid, it.name), shown = !hide || openSet.has(it.i);
          return `<div class="stcard ${shown ? "" : "closed"}" data-i="${it.i}">
            <div class="sthead"><span class="uname">${it.name}</span>${L ? `<span class="badge stampb">${STAMP[L]}</span>` : ""}${hide ? `<span class="sttoggle">${shown ? "收起" : "點開看答案"}</span>` : ""}</div>
            ${shown ? `<dl class="reveal">${order.filter(f => f !== sub.groupField).map(f => `<dt>${sub.fields[f].label}</dt><dd>${it.values[f]}</dd>`).join("")}</dl>
            <div class="mem">💡 ${it.memo}</div>` : ""}
          </div>`;
        }).join("")}
      </div>`).join("")}
    <div class="card" style="text-align:center">
      <p>看熟了嗎？去挑戰看看！</p>
      <div class="row" style="justify-content:center"><button class="primary" id="goPlay">🕵️ 開始一般關</button><button id="back2">回單元</button></div>
    </div>`;
  document.getElementById("back").onclick = () => unitPage(sid, uid);
  document.getElementById("back2").onclick = () => unitPage(sid, uid);
  document.getElementById("goPlay").onclick = () => start(sid, uid, false);
  document.getElementById("showAll").onclick = () => { save("guess-study-hide", false); study(sid, uid, { hide: false }); };
  document.getElementById("hideAll").onclick = () => { save("guess-study-hide", true); study(sid, uid, { hide: true }); };
  if (hide) app.querySelectorAll(".stcard").forEach(c => c.onclick = () => {
    const i = +c.dataset.i, y = window.scrollY;
    openSet.has(i) ? openSet.delete(i) : openSet.add(i);
    study(sid, uid, { hide: true, open: openSet });
    window.scrollTo(0, y);
  });
  if (!opts.open) window.scrollTo(0, 0);
}

// ---------- 中途回首頁：這局已拿到的分數照樣存，猜中的至少保住印章 ----------
function quit(){
  if (S && !S.saved){
    if (S.total > 0) save("guess-wallet", getWallet() + S.total);
    if (S.mode !== "group" && S.cur && S.cur.parts && !S.cur.saved) raise(S.sid, S.uid, S.cur.it.name, S.hard ? 2 : 1);
    pushProgress();
  }
  home();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => { if (e.target.closest("#quit")) quit(); });

home();
</script>
